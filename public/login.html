<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Biruk Gebre" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in - BiTS Connect</title>
    <link rel="icon" type="image/png" href="assets/img/favicon.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="assets/css/custom.css" rel="stylesheet" />
  </head>
  <body>
    <main class="auth-bg">
      <div class="card auth-card">
        <div class="card-body p-4">
          <a class="d-flex align-items-center text-decoration-none mb-3" href="index.html">
            <img src="assets/img/bits-logo.png" alt="BiTS Connect" class="brand-logo" />
          </a>

          <ul class="nav nav-pills nav-fill mb-3" id="authTabs">
            <li class="nav-item"><button class="nav-link active" data-mode="login" type="button">Sign in</button></li>
            <li class="nav-item"><button class="nav-link" data-mode="register" type="button">Create account</button></li>
          </ul>

          <div class="alert alert-warning py-2 small d-none" id="expiredNote">Your session expired. Please sign in again.</div>
          <div class="alert alert-danger py-2 small d-none" id="authError" role="alert"></div>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label class="form-label" for="loginEmail">Email</label>
              <input class="form-control" id="loginEmail" type="email" autocomplete="username" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="loginPassword">Password</label>
              <input class="form-control" id="loginPassword" type="password" autocomplete="current-password" required />
            </div>
            <button class="btn btn-primary w-100" type="submit">Sign in</button>
            <div class="small text-muted text-center mt-3">Demo student: <code>biruk.gebre@bits.edu</code> / <code>demo12345</code></div>
          </form>

          <form id="registerForm" class="d-none" novalidate>
            <div class="mb-3">
              <label class="form-label" for="regName">Full name</label>
              <input class="form-control" id="regName" autocomplete="name" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="regEmail">Email</label>
              <input class="form-control" id="regEmail" type="email" autocomplete="email" required />
            </div>
            <div class="mb-3" id="studentIdRow">
              <label class="form-label" for="regStudentId">Student ID <span class="text-muted small">(optional)</span></label>
              <input class="form-control" id="regStudentId" placeholder="e.g. 0998/24" />
            </div>
            <div class="mb-3">
              <label class="form-label" for="regPassword">Password</label>
              <input class="form-control" id="regPassword" type="password" autocomplete="new-password" minlength="8" required />
              <div class="form-text">At least 8 characters.</div>
            </div>
            <button class="btn btn-primary w-100" type="submit">Create account</button>
          </form>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
